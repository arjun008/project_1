<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f7f7f7">
  <title>T-Rex Dino Runner</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrapper">
    <header class="game-header">
      <h1 class="game-title">T-REX RUNNER</h1>
      <div class="scoreboard">
        <span class="score-label">HI</span>
        <span id="high-score" class="score-value">00000</span>
        <span id="current-score" class="score-value active-score">00000</span>
      </div>
    </header>

    <div class="canvas-container" id="canvas-container">
      <canvas id="game-canvas" width="800" height="260"></canvas>
      
      <div id="start-overlay" class="overlay">
        <div class="overlay-card">
          <div class="dino-icon">🦖</div>
          <h2>TAP OR PRESS SPACE</h2>
          <p class="desktop-hint">Jump over cacti &amp; duck under pterodactyls</p>
          <p class="mobile-hint">Tap / Swipe ↑ to Jump &bull; Swipe ↓ to Duck</p>
          <button id="start-btn" class="arcade-btn">START GAME</button>
        </div>
      </div>

      <div id="game-over-overlay" class="overlay hidden">
        <div class="overlay-card">
          <h2 class="game-over-text">GAME OVER</h2>
          <p id="game-over-score">Score: 0</p>
          <button id="restart-btn" class="arcade-btn">PLAY AGAIN</button>
          <span class="key-hint">or tap screen / press SPACE</span>
        </div>
      </div>
    </div>

    <!-- Mobile Touch Arcade Controls (Visible on mobile & touch devices) -->
    <div class="touch-controls" id="touch-controls">
      <button id="touch-duck" class="touch-btn duck-btn" aria-label="Duck">
        <span class="touch-icon">⬇</span>
        <span class="touch-text">DUCK</span>
      </button>
      <button id="touch-jump" class="touch-btn jump-btn" aria-label="Jump">
        <span class="touch-icon">⬆</span>
        <span class="touch-text">JUMP</span>
      </button>
    </div>

    <footer class="game-footer">
      <div class="instructions desktop-only">
        <span><kbd>Space</kbd> / <kbd>↑</kbd> Jump</span>
        <span><kbd>↓</kbd> Duck</span>
        <span><kbd>M</kbd> Mute</span>
      </div>
      <div class="instructions mobile-only">
        <span>👉 Tap / Swipe ↑ Jump &bull; Swipe ↓ Duck</span>
      </div>
      <div class="audio-toggle">
        <button id="sound-btn" class="icon-btn" title="Toggle Sound">🔊 Sound: ON</button>
      </div>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
